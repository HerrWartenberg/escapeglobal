<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flora-Realschule Düsseldorf – Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark: #0c2594;
      --blue-mid:  #29aae1;
      --gold:      #f5a623;
      --bg:        #eaf3fb;
      --border:    #c5d9ef;
      --header-h:  72px;
      --gap:       12px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      height: var(--header-h);
      background: var(--blue-dark);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      box-shadow: 0 2px 10px rgba(12,37,148,.4);
    }

    .header-left { display: flex; align-items: center; gap: 14px; }

    .school-logo img {
      height: 52px;
      width: 52px;
      object-fit: contain;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.3));
    }

    .school-name    { font-size: 19px; font-weight: 700; }
    .school-subtitle { font-size: 12px; color: var(--blue-mid); margin-top: 2px; font-weight: 500; }

    .header-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }

    #clock {
      font-size: 30px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }

    #date-display {
      font-size: 13px;
      color: rgba(255,255,255,.75);
      text-align: right;
      line-height: 1.5;
    }

    /* ── Split Layout ────────────────────────────────────────── */
    .split {
      display: flex;
      height: calc(100vh - var(--header-h));
      gap: var(--gap);
      padding: var(--gap);
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .13em;
      color: #5a7a9a;
      margin-bottom: 6px;
      padding-left: 2px;
    }

    .panel-card {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(12,37,148,.08), 0 4px 16px rgba(12,37,148,.06);
      border: 1px solid var(--border);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="school-logo">
      <img src="logo.png" alt="Flora-Realschule Logo">
    </div>
    <div>
      <div class="school-name">Flora-Realschule Düsseldorf</div>
      <div class="school-subtitle">Aktuelles &amp; Vertretungsplan</div>
    </div>
  </div>
  <div class="header-right">
    <div id="date-display"></div>
    <div id="clock"></div>
  </div>
</header>

<div class="split">

  <div class="panel">
    <div class="panel-label">Vertretungsplan heute</div>
    <div class="panel-card">
      <iframe id="frame-subst"
        src="https://flora-realschule.webuntis.com/WebUntis/monitor?school=flora-realschule&monitorType=subst&format=SuS_aktueller_Tag"
        title="Vertretungsplan">
      </iframe>
    </div>
  </div>

  <div class="panel">
    <div class="panel-label">Kicktipp – Tippübersicht</div>
    <div class="panel-card" style="overflow-y: auto;">
      <div id="kicktipp-widget" style="width:100%; min-height:100%;"></div>
    </div>
  </div>

</div>

<script>
  const REFRESH_MS = 5 * 60 * 1000;

  // ── Uhr ──────────────────────────────────────────────────────
  const DAYS   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  function updateClock() {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('clock').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('date-display').innerHTML =
      `${DAYS[now.getDay()]}<br>${now.getDate()}. ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Iframes alle 5 Min neu laden ─────────────────────────────
  function reloadFrame(id) {
    const f = document.getElementById(id);
    const s = f.src;
    f.src = '';
    requestAnimationFrame(() => { f.src = s; });
  }

  // Kicktipp-Widget neu laden: Script-Tag neu einfügen
  function reloadKicktipp() {
    const container = document.getElementById('kicktipp-widget');
    container.innerHTML = '';
    const s = document.createElement('script');
    s.src = 'https://www.kicktipp.de/flora26/javascript';
    container.appendChild(s);
  }

  setInterval(() => {
    reloadFrame('frame-subst');
    reloadKicktipp();
  }, REFRESH_MS);

</script>

<script src="https://www.kicktipp.de/flora26/javascript"></script>

</body>
</html>
