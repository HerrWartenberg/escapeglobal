<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schulnews</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #fff;
      color: #0a1a3a;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Beitrags-Slides ──────────────────────────────── */
    #stage {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 20px 20px 8px;
      overflow-y: auto;
      opacity: 0;
      transition: opacity .7s ease;
      pointer-events: none;
      scrollbar-width: thin;
      scrollbar-color: #c5d9ef transparent;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .post-date {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #5a7a9a;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .post-date::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: #f5a623;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .post-title {
      font-size: 18px;
      font-weight: 700;
      color: #0c2594;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .post-text {
      font-size: 13px;
      line-height: 1.65;
      color: #2a3a5a;
    }

    .post-text p { margin-bottom: 8px; }
    .post-text p:last-child { margin-bottom: 0; }
    .post-text a { color: #0c2594; }

    /* ── Bild-Slider ──────────────────────────────────── */
    .img-slider {
      position: relative;
      width: 100%;
      background: transparent;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .img-slider img {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      display: block;
      opacity: 0;
      position: absolute;
      top: 0; left: 0;
      transition: opacity .5s ease;
    }

    .img-slider img.visible {
      opacity: 1;
      position: relative;
    }

    .slider-dots {
      position: absolute;
      bottom: 6px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 5px;
      pointer-events: none;
    }

    .slider-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.5);
      transition: background .3s;
    }

    .slider-dot.on { background: #fff; }

    /* ── Post-Navigationsdots ─────────────────────────── */
    #post-nav {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .post-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #c5d9ef;
      transition: background .3s, transform .3s;
      cursor: pointer;
    }

    .post-dot.on {
      background: #0c2594;
      transform: scale(1.25);
    }

    /* ── Fortschrittsbalken ───────────────────────────── */
    #progress {
      height: 3px;
      background: #eaf3fb;
      flex-shrink: 0;
    }

    #progress-fill {
      height: 100%;
      background: #29aae1;
      width: 0%;
      transition: width 1s linear;
    }

    /* ── Lade-/Fehlerstatus ───────────────────────────── */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      color: #5a7a9a;
      font-size: 14px;
      text-align: center;
      padding: 32px;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #dde8f4;
      border-top-color: #29aae1;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="progress"><div id="progress-fill"></div></div>
<div id="stage">
  <div class="slide active"><div class="state"><div class="spinner"></div><span>Lade Beiträge…</span></div></div>
</div>
<div id="post-nav"></div>

<script>
  const API           = 'https://www.realschule-florastrasse.de/wp-json/wp/v2/posts?categories=34&per_page=3&_embed';
  const POST_DURATION = 18000;  // ms pro Beitrag
  const IMG_DURATION  = 4000;   // ms pro Bild

  const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                  'September','Oktober','November','Dezember'];

  function fmtDate(s) {
    const d = new Date(s);
    return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }

  // Bilder aus Content extrahieren, aus Text entfernen
  function parseContent(html) {
    const doc = new DOMParser().parseFromString(html || '', 'text/html');
    const imgs = [...doc.querySelectorAll('img')]
      .map(i => i.src)
      .filter(s => s && !s.endsWith('gif'));
    doc.querySelectorAll('figure, img').forEach(el => el.remove());
    doc.querySelectorAll('p').forEach(p => { if (!p.textContent.trim()) p.remove(); });
    return { imgs, text: doc.body.innerHTML };
  }

  // Slider-HTML bauen
  function buildSlider(imgs) {
    if (!imgs.length) return '';
    const dotsHtml = imgs.length > 1
      ? `<div class="slider-dots">${imgs.map((_, i) =>
          `<span class="slider-dot${i === 0 ? ' on' : ''}"></span>`).join('')}</div>`
      : '';
    return `
      <div class="img-slider">
        ${imgs.map((src, i) =>
          `<img src="${src}" alt="" loading="lazy" class="${i === 0 ? 'visible' : ''}" onerror="this.remove()">`
        ).join('')}
        ${dotsHtml}
      </div>`;
  }

  // ── Bild-Slider-Steuerung ────────────────────────────
  const imgTimers = {};

  function startImgSlider(slideEl, postIdx) {
    if (imgTimers[postIdx]) clearInterval(imgTimers[postIdx]);
    const slider = slideEl.querySelector('.img-slider');
    if (!slider) return;
    const imgs = [...slider.querySelectorAll('img')];
    const dots = [...slider.querySelectorAll('.slider-dot')];
    if (imgs.length < 2) return;

    let cur = 0;
    imgTimers[postIdx] = setInterval(() => {
      imgs[cur].classList.remove('visible');
      dots[cur]?.classList.remove('on');
      cur = (cur + 1) % imgs.length;
      imgs[cur].classList.add('visible');
      dots[cur]?.classList.add('on');
    }, IMG_DURATION);
  }

  function stopImgSlider(postIdx) {
    if (imgTimers[postIdx]) { clearInterval(imgTimers[postIdx]); delete imgTimers[postIdx]; }
  }

  // ── Post-Wechsel ─────────────────────────────────────
  let currentPost = 0;
  let postTimer   = null;
  let progStart   = 0;
  let slides      = [];
  let dots        = [];

  function showPost(idx) {
    slides[currentPost]?.classList.remove('active');
    dots[currentPost]?.classList.remove('on');
    stopImgSlider(currentPost);

    currentPost = (idx + slides.length) % slides.length;
    slides[currentPost].classList.add('active');
    slides[currentPost].scrollTop = 0;
    dots[currentPost]?.classList.add('on');
    startImgSlider(slides[currentPost], currentPost);
    startProgress();
  }

  // ── Fortschrittsbalken ───────────────────────────────
  const fill = document.getElementById('progress-fill');
  let rafId  = null;

  function startProgress() {
    progStart = Date.now();
    if (rafId) cancelAnimationFrame(rafId);
    function tick() {
      const pct = Math.min(100, ((Date.now() - progStart) / POST_DURATION) * 100);
      fill.style.transition = 'width 1s linear';
      fill.style.width = pct + '%';
      if (pct < 100) rafId = requestAnimationFrame(tick);
    }
    fill.style.transition = 'none';
    fill.style.width = '0%';
    requestAnimationFrame(tick);
  }

  // ── Hauptfunktion ────────────────────────────────────
  async function load() {
    try {
      const res   = await fetch(API);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const posts = await res.json();
      if (!posts.length) throw new Error('Keine Beiträge gefunden');

      const stage  = document.getElementById('stage');
      const navEl  = document.getElementById('post-nav');

      stage.innerHTML = posts.map((post, i) => {
        const { imgs, text } = parseContent(post.content?.rendered);
        return `
          <div class="slide${i === 0 ? ' active' : ''}">
            <div class="post-date">${fmtDate(post.date)}</div>
            <h2 class="post-title">${post.title?.rendered || ''}</h2>
            ${buildSlider(imgs)}
            <div class="post-text">${text}</div>
          </div>`;
      }).join('');

      navEl.innerHTML = posts.map((_, i) =>
        `<span class="post-dot${i === 0 ? ' on' : ''}" data-i="${i}"></span>`).join('');

      slides = [...stage.querySelectorAll('.slide')];
      dots   = [...navEl.querySelectorAll('.post-dot')];

      // Klick auf Dots
      dots.forEach(d => d.addEventListener('click', () => {
        clearInterval(postTimer);
        showPost(+d.dataset.i);
        if (slides.length > 1) postTimer = setInterval(() => showPost(currentPost + 1), POST_DURATION);
      }));

      currentPost = 0;
      startImgSlider(slides[0], 0);
      startProgress();

      if (slides.length > 1) {
        if (postTimer) clearInterval(postTimer);
        postTimer = setInterval(() => showPost(currentPost + 1), POST_DURATION);
      }

    } catch (e) {
      document.getElementById('stage').innerHTML =
        `<div class="slide active"><div class="state">⚠️ ${e.message}</div></div>`;
    }
  }

  load();
  setInterval(load, 5 * 60 * 1000);
</script>

</body>
</html>
