<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schulnews</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #fff;
      color: #0a1a3a;
      padding: 16px;
      overflow-x: hidden;
    }

    .post {
      padding: 20px 0;
      border-bottom: 1px solid #dde8f4;
    }

    .post:last-child { border-bottom: none; }

    .post-date {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #5a7a9a;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .post-date::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: #f5a623;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .post-title {
      font-size: 17px;
      font-weight: 700;
      color: #0c2594;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .post-content {
      font-size: 14px;
      line-height: 1.65;
      color: #2a3a5a;
    }

    .post-content img {
      max-width: 100%;
      width: auto;
      height: auto;
      border-radius: 6px;
      margin: 10px auto;
      display: block;
    }

    .post-content p { margin-bottom: 10px; }
    .post-content p:last-child { margin-bottom: 0; }
    .post-content a { color: #0c2594; }

    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 48px 16px;
      color: #5a7a9a;
      font-size: 14px;
      text-align: center;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #dde8f4;
      border-top-color: #29aae1;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="feed">
  <div class="state"><div class="spinner"></div><span>Lade Beiträge…</span></div>
</div>

<script>
  const API = 'https://www.realschule-florastrasse.de/wp-json/wp/v2/posts?categories=34&per_page=10&_embed';

  const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                  'September','Oktober','November','Dezember'];

  function formatDate(s) {
    const d = new Date(s);
    return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }

  async function load() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const posts = await res.json();

      if (!posts.length) {
        document.getElementById('feed').innerHTML =
          '<div class="state">📭 Keine Beiträge vorhanden.</div>';
        return;
      }

      document.getElementById('feed').innerHTML = posts.map(post => {
        const title   = post.title?.rendered || '';
        const date    = formatDate(post.date);
        const content = post.content?.rendered || '';

        return `
          <div class="post">
            <div class="post-date">${date}</div>
            <div class="post-title">${title}</div>
            <div class="post-content">${content}</div>
          </div>`;
      }).join('');

    } catch (e) {
      document.getElementById('feed').innerHTML =
        `<div class="state">⚠️ Beiträge konnten nicht geladen werden.<br><small>${e.message}</small></div>`;
    }
  }

  load();
  // alle 5 Minuten neu laden
  setInterval(load, 5 * 60 * 1000);
</script>

</body>
</html>
